[package]
name = "ai-ping"
version = "0.1.0"
description = "API 模型首字测速工具"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ai_ping_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls", "http2", "gzip"] }
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
futures-util = "0.3"
httpdate = "1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
